# One step of the aarch64 build (aarch64.yml): on GitHub's arm64 runners,
# free for a public repository, where hideforge's target-environment
# stages run natively — on an x86 machine they would run every aarch64
# binary under emulation, for days.
#
# A job lasts at most six hours, and building hideOS from source takes
# longer: each step takes the work directory the last one left — the
# store of built recipes, the downloaded sources, the development keys —
# from the Actions cache, builds for five hours, and leaves it for the next.
# The step that finishes boots the image in QEMU.
name: aarch64 step

on:
  workflow_call:
    inputs:
      edition:
        type: string
        required: true
      step:
        type: number
        required: true
    outputs:
      state:
        description: "done, more (time ran out) or failed"
        value: ${{ jobs.build.outputs.state }}

jobs:
  build:
    name: step ${{ inputs.step }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    outputs:
      state: ${{ steps.build.outputs.state }}
    steps:
      - uses: actions/checkout@v4

      # The bootstrap needs tens of gigabytes; the image comes with
      # toolchains hideOS does not use.
      - name: Room on the disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          df -h /

      - name: Rust, QEMU and its firmware on the runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-arm qemu-efi-aarch64 zstd
          command -v cargo || {
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          }

      - name: The work directory, as the last step left it
        uses: actions/cache/restore@v4
        with:
          path: work.tar.zst
          key: aarch64-${{ inputs.edition }}-${{ github.run_id }}-${{ inputs.step }}
          restore-keys: |
            aarch64-${{ inputs.edition }}-${{ github.run_id }}-
            aarch64-${{ inputs.edition }}-

      # The builder's `hideos-work` volume, bound to a directory, so that
      # what the builder writes there can be packed for the next step.
      # Owners, modes and capabilities as the store has them: as root.
      - name: Unpack it for the builder
        run: |
          mkdir -p work
          if [ -f work.tar.zst ]; then
            zstd -dc work.tar.zst | sudo tar --xattrs --xattrs-include='*' -C work -xf -
            rm work.tar.zst
          fi
          sudo du -sh work || true
          docker volume create --driver local --opt type=none --opt o=bind \
            --opt device="$PWD/work" hideos-work

      - run: cargo xtask builder build

      # Host-environment recipes hash the builder they ran in, and a builder
      # image built again on another runner has another ID: the builder's
      # definition stands for it, so the store carries over.
      - name: Build, for at most five hours
        id: build
        run: |
          HIDEFORGE_HOST_ID="containerfile-$(sha256sum tools/builder/Containerfile | cut -c1-32)-arm64"
          export HIDEFORGE_HOST_ID
          set +e
          timeout --signal=TERM 5h cargo xtask image --arch aarch64 --edition ${{ inputs.edition }}
          status=$?
          # The build runs in the builder; stopping xtask does not stop it.
          docker ps -q | xargs -r docker kill
          df -h /
          case $status in
            0) echo state=done >> "$GITHUB_OUTPUT" ;;
            124) echo "five hours are up: the next step goes on from here"
                 echo state=more >> "$GITHUB_OUTPUT" ;;
            *) echo state=failed >> "$GITHUB_OUTPUT" ;;
          esac
          exit 0

      - name: Boot it
        if: steps.build.outputs.state == 'done' && inputs.edition == 'minimal'
        run: cargo xtask boot --arch aarch64 --test

      # Only what the next step needs: a build's scratch directory and
      # cargo's target directory are made again.
      - name: Pack the work directory for the next step
        if: ${{ !cancelled() }}
        run: |
          sudo tar --xattrs --xattrs-include='*' -C work -cf - store sources keys \
            | zstd -T0 -3 > work.tar.zst
          ls -lh work.tar.zst

      - uses: actions/cache/save@v4
        if: ${{ !cancelled() }}
        with:
          path: work.tar.zst
          key: aarch64-${{ inputs.edition }}-${{ github.run_id }}-${{ inputs.step }}

      - name: The build logs
        if: ${{ !cancelled() && steps.build.outputs.state != 'done' }}
        run: sudo tar -C work -czf logs.tar.gz logs || true
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outputs.state != 'done' }}
        with:
          name: aarch64-${{ inputs.edition }}-logs-${{ inputs.step }}
          path: logs.tar.gz
          if-no-files-found: ignore
