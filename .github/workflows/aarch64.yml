# Builds hideOS for aarch64 from source and boots it in QEMU's virt
# machine, on GitHub's arm64 runners. By hand only, from the Actions tab —
# like CI, never on a push.
#
# Up to six steps of five hours each (aarch64-step.yml), every one going on
# from where the last stopped; a step after the one that finished, or after
# one that failed, does not start. A run continues the last run's work.
name: aarch64

on:
  workflow_dispatch:
    inputs:
      edition:
        description: Edition
        type: choice
        options: [minimal, workstation]
        default: minimal

concurrency:
  group: aarch64-${{ inputs.edition }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  step1:
    uses: ./.github/workflows/aarch64-step.yml
    with: { edition: "${{ inputs.edition }}", step: 1 }
  step2:
    needs: [step1]
    if: ${{ !cancelled() && needs.step1.outputs.state == 'more' }}
    uses: ./.github/workflows/aarch64-step.yml
    with: { edition: "${{ inputs.edition }}", step: 2 }
  step3:
    needs: [step2]
    if: ${{ !cancelled() && needs.step2.outputs.state == 'more' }}
    uses: ./.github/workflows/aarch64-step.yml
    with: { edition: "${{ inputs.edition }}", step: 3 }
  step4:
    needs: [step3]
    if: ${{ !cancelled() && needs.step3.outputs.state == 'more' }}
    uses: ./.github/workflows/aarch64-step.yml
    with: { edition: "${{ inputs.edition }}", step: 4 }
  step5:
    needs: [step4]
    if: ${{ !cancelled() && needs.step4.outputs.state == 'more' }}
    uses: ./.github/workflows/aarch64-step.yml
    with: { edition: "${{ inputs.edition }}", step: 5 }
  step6:
    needs: [step5]
    if: ${{ !cancelled() && needs.step5.outputs.state == 'more' }}
    uses: ./.github/workflows/aarch64-step.yml
    with: { edition: "${{ inputs.edition }}", step: 6 }

  # What the chain came to, as the run's result: green only if a step
  # finished the image.
  result:
    needs: [step1, step2, step3, step4, step5, step6]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          for state in "${{ needs.step1.outputs.state }}" "${{ needs.step2.outputs.state }}" \
                       "${{ needs.step3.outputs.state }}" "${{ needs.step4.outputs.state }}" \
                       "${{ needs.step5.outputs.state }}" "${{ needs.step6.outputs.state }}"; do
            echo "step: ${state:-not run}"
            [ "$state" = "done" ] && exit 0
            [ "$state" = "failed" ] && { echo "a recipe failed; its log is the step's artifact"; exit 1; }
          done
          echo "six steps were not enough: run it again, it goes on from here"
          exit 1
