# Temporary tool, cross-compiled for stage 1 to run.
[package]
name = "stage0-coreutils"
version = "9.12"
description = "Basic file, shell and text utilities (temporary, for stage 1)"
license = "GPL-3.0-or-later"
stage = 0

# GPG signature verified against the GNU keyring (Pádraig Brady).
[[source]]
url = "https://ftp.gnu.org/gnu/coreutils/coreutils-9.12.tar.xz"
sha256 = "a480198559733e9b3da999e90543ac6f888a2caa544d8d664c5a1f17e528e210"

[depends]
build = ["stage0-cross-toolchain"]
run = []

[build]
environment = "host"
script = """
./configure \\
    --prefix=/usr \\
    --host="$TARGET" \\
    --build="$(build-aux/config.guess)" \\
    --enable-install-program=hostname \\
    --enable-no-install-program=kill,uptime
make -j"$JOBS"
make DESTDIR="$SYSROOT" install
"""
