# Temporary tool, cross-compiled for stage 1 to run.
[package]
name = "stage0-gawk"
version = "5.3.2"
description = "GNU awk (temporary, for stage 1)"
license = "GPL-3.0-or-later"
stage = 0

# 5.3.2, not 5.4.1: 5.4.1 gets GCC's opt-gather.awk wrong (the first record
# comes out as "0"), natively as well as cross-compiled, and GCC's generated
# options.cc is then full of #error. 5.3.2 is the version Linux From Scratch
# builds GCC with.
#
# GPG signature verified against the GNU keyring (Arnold Robbins).
[[source]]
url = "https://ftp.gnu.org/gnu/gawk/gawk-5.3.2.tar.xz"
sha256 = "f8c3486509de705192138b00ef2c00bbbdd0e84c30d5c07d23fc73a9dc4cc9cc"

[depends]
build = ["stage0-cross-toolchain"]
run = []

[build]
environment = "host"
script = """
# The extensions are not needed to build anything in stage 1.
sed -i 's/extras//' Makefile.in
./configure \\
    --prefix=/usr \\
    --host="$TARGET" \\
    --build="$(build-aux/config.guess)"
make -j"$JOBS"
make DESTDIR="$SYSROOT" install
"""
