# Temporary tool, cross-compiled for stage 1 to run.
[package]
name = "stage0-gzip"
version = "1.15"
description = "Compression utility (temporary, for stage 1)"
license = "GPL-3.0-or-later"
stage = 0

# GPG signature verified against the GNU keyring (Jim Meyering).
[[source]]
url = "https://ftp.gnu.org/gnu/gzip/gzip-1.15.tar.xz"
sha256 = "9aa0cc780dec156b8282844833b342ab7cb08c25d2cd9a1869cdd0df31deff48"

[depends]
build = ["stage0-cross-toolchain"]
run = []

[build]
environment = "host"
script = """
./configure \\
    --prefix=/usr \\
    --host="$TARGET" \\
    --build="$(build-aux/config.guess)"
make -j"$JOBS"
make DESTDIR="$SYSROOT" install
"""
