# Temporary tool, cross-compiled for stage 1 to run.
[package]
name = "stage0-patch"
version = "2.8"
description = "Applies diffs (temporary, for stage 1)"
license = "GPL-3.0-or-later"
stage = 0

# GPG signature verified against the GNU keyring (Andreas Gruenbacher).
[[source]]
url = "https://ftp.gnu.org/gnu/patch/patch-2.8.tar.xz"
sha256 = "f87cee69eec2b4fcbf60a396b030ad6aa3415f192aa5f7ee84cad5e11f7f5ae3"

[depends]
build = ["stage0-cross-toolchain"]
run = []

[build]
environment = "host"
script = """
./configure \\
    --prefix=/usr \\
    --host="$TARGET" \\
    --build="$(build-aux/config.guess)"
make -j"$JOBS"
make DESTDIR="$SYSROOT" install
"""
