# The kernel's userspace API headers, which glibc is built against.
[package]
name = "stage0-linux-headers"
version = "7.2.8"
description = "Linux API headers for the bootstrap sysroot"
license = "GPL-2.0-only WITH Linux-syscall-note"
homepage = "https://kernel.org"
stage = 0

# Checked against kernel.org's published sha256sums for v7.x.
[[source]]
url = "https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.2.8.tar.xz"
sha256 = "12e8d5a973d1ad7c5a5c69882e4022b131ed715db7003fdcd760ddf8c3e51941"

[depends]
build = ["stage0-filesystem"]

[build]
environment = "host"
script = """
case "$ARCH" in
    aarch64) karch=arm64 ;;
    *) karch="$ARCH" ;;
esac
make mrproper
make ARCH="$karch" headers
find usr/include -type f ! -name '*.h' -delete
cp -r usr/include/. "$SYSROOT/usr/include/"
"""
