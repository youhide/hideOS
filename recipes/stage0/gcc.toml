# Cross GCC, pass 1: C and C++ compilers for $TARGET, built before there is a
# C library for it. No libc means no shared libgcc, no threads, and no
# libstdc++ yet; those come once glibc exists.
[package]
name = "stage0-gcc"
version = "16.2.0"
description = "Cross GCC for the bootstrap, pass 1"
license = "GPL-3.0-or-later WITH GCC-exception-3.1"
homepage = "https://gcc.gnu.org"
stage = 0

# All four: GPG signatures verified against the GNU keyring.
[[source]]
url = "https://ftp.gnu.org/gnu/gcc/gcc-16.2.0/gcc-16.2.0.tar.xz"
sha256 = "e6738e29597f733270731aa90600f37ffdc045079dfc27ec7e8192cc81085c3e"

[[source]]
url = "https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz"
sha256 = "a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898"
dest = "gmp"

[[source]]
url = "https://ftp.gnu.org/gnu/mpfr/mpfr-4.2.2.tar.xz"
sha256 = "b67ba0383ef7e8a8563734e2e889ef5ec3c3b898a01d00fa0a6869ad81c6ce01"
dest = "mpfr"

[[source]]
url = "https://ftp.gnu.org/gnu/mpc/mpc-1.4.1.tar.xz"
sha256 = "91204cd32f164bd3b7c992d4a6a8ce6519511aadab30f78b6982d0bf8d73e931"
dest = "mpc"

[depends]
build = ["stage0-binutils"]
# A compiler that cannot assemble or link is not one.
run = ["stage0-binutils"]

[build]
environment = "host"
script = """
# 64-bit libraries in lib, not lib64: hideOS has one library directory.
if [ "$ARCH" = x86_64 ]; then
    sed -e '/m64=/s/lib64/lib/' -i gcc/config/i386/t-linux64
fi

mkdir build && cd build
../configure \\
    --target="$TARGET" \\
    --prefix="$SYSROOT/tools" \\
    --with-glibc-version=2.44 \\
    --with-sysroot="$SYSROOT" \\
    --with-newlib \\
    --without-headers \\
    --enable-default-pie \\
    --enable-default-ssp \\
    --disable-nls \\
    --disable-shared \\
    --disable-multilib \\
    --disable-threads \\
    --disable-libatomic \\
    --disable-libgomp \\
    --disable-libquadmath \\
    --disable-libssp \\
    --disable-libvtv \\
    --disable-libstdcxx \\
    --enable-languages=c,c++
make -j"$JOBS"
make install

# The limits.h fixincludes made is incomplete without libc's; this is the
# full one glibc's headers expect to find.
cd ..
cat gcc/limitx.h gcc/glimits.h gcc/limity.h > \\
    "$(dirname "$("$TARGET-gcc" -print-libgcc-file-name)")/include/limits.h"
"""
