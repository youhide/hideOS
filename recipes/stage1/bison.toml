[package]
name = "stage1-bison"
version = "3.8.2"
description = "Parser generator (temporary)"
license = "GPL-3.0-or-later"
stage = 1

# GPG signature verified against the GNU keyring (Akim Demaille).
[[source]]
url = "https://ftp.gnu.org/gnu/bison/bison-3.8.2.tar.xz"
sha256 = "9bba0214ccf7f1079c5d59210045227bcf619519840ebfa80cd3849cff5a5bf2"

[depends]
build = ["stage0-root", "stage1-etc"]

[build]
script = """
./configure --prefix=/usr --docdir=/usr/share/doc/bison-3.8.2
make -j"$JOBS"
make install
"""
