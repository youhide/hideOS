[package]
name = "stage1-bc"
version = "1.08.2"
description = "Calculator the kernel build uses for constants (temporary)"
license = "GPL-3.0-or-later"
stage = 1

# GPG signature verified against the GNU keyring.
[[source]]
url = "https://ftp.gnu.org/gnu/bc/bc-1.08.2.tar.gz"
sha256 = "ae470fec429775653e042015edc928d07c8c3b2fc59765172a330d3d87785f86"

[depends]
build = ["stage0-root", "stage1-etc", "stage1-flex", "stage1-bison", "stage1-texinfo"]

[build]
script = """
./configure --prefix=/usr
make -j"$JOBS"
make install
"""
