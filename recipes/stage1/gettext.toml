# Only the three programs other packages' builds call. The full gettext is a
# stage-2 package.
[package]
name = "stage1-gettext"
version = "1.0"
description = "msgfmt, msgmerge and xgettext (temporary)"
license = "GPL-3.0-or-later"
stage = 1

# GPG signature verified against the GNU keyring (Bruno Haible).
[[source]]
url = "https://ftp.gnu.org/gnu/gettext/gettext-1.0.tar.xz"
sha256 = "71132a3fb71e68245b8f2ac4e9e97137d3e5c02f415636eb508ae607bc01add7"

[depends]
build = ["stage0-root", "stage1-etc"]

[build]
script = """
./configure --disable-shared
make -j"$JOBS"
cp gettext-tools/src/{msgfmt,msgmerge,xgettext} /usr/bin
"""
