# Pure Python, and stage 1's Python has no pip or setuptools: the
# package is copied into site-packages and given a launcher, which is all
# an install would do.
[package]
name = "meson"
version = "1.12.1"
description = "The build system most of the desktop uses"
license = "Apache-2.0"
homepage = "https://mesonbuild.com"

[[source]]
url = "https://github.com/mesonbuild/meson/releases/download/1.12.1/meson-1.12.1.tar.gz"
sha256 = "ab0a6ca09f8ef70c564c8241fb5a23957886a0b53fb58412b5e07eaf07dba743"

[depends]
build = ["toolchain", "python"]
run = ["python"]

[build]
script = """
site=$(python3 -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
mkdir -p "$site"
cp -r mesonbuild "$site/"
# Compiled here, so that no build that runs meson writes __pycache__
# into its own output. Hash-checked, because SOURCE_DATE_EPOCH is set.
python3 -m compileall -q "$site/mesonbuild"
cat > /usr/bin/meson <<'END'
#!/usr/bin/env python3
import sys
from mesonbuild.mesonmain import main
sys.exit(main())
END
chmod 755 /usr/bin/meson
"""
