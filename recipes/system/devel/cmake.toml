# With its bundled copies of curl, libarchive and the rest: cmake is a
# build tool here, never in an image, and the bundled set is what
# upstream tests. Without ccmake, which would link stage 1's ncurses.
[package]
name = "cmake"
version = "4.4.4"
description = "Cross-platform build system, for LLVM"
license = "BSD-3-Clause"
homepage = "https://cmake.org"

[[source]]
url = "https://github.com/Kitware/CMake/releases/download/v4.4.4/cmake-4.4.4.tar.gz"
sha256 = "bd24c30d80a7744ae84b845ff080cc8453b06c622ef01066564108e9cefc44cf"

[depends]
build = ["toolchain"]
run = ["glibc", "gcc"]

[build]
script = """
./bootstrap \\
    --prefix=/usr \\
    --parallel="$JOBS" \\
    --no-system-libs \\
    --no-qt-gui \\
    --docdir=/share/doc/cmake \\
    -- \\
    -DCMAKE_USE_OPENSSL=OFF \\
    -DBUILD_CursesDialog=OFF \\
    -DBUILD_TESTING=OFF
make -j"$JOBS"
make install
rm -rf /usr/share/doc/cmake
"""
