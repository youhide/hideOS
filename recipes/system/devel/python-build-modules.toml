# Pure-Python modules the desktop's code generators import: Mesa needs
# mako, packaging and PyYAML; elogind needs Jinja2; both template
# engines need MarkupSafe. Copied into site-packages, as with meson.
# MarkupSafe's C speedups are optional and left out.
[package]
name = "python-build-modules"
version = "1"
description = "mako, MarkupSafe, PyYAML, packaging and Jinja2, for Mesa's and elogind's builds"
license = "MIT AND BSD-3-Clause AND Apache-2.0"

[[source]]
url = "https://files.pythonhosted.org/packages/5a/09/e07c4b5579a79f4b16f8d4f29f6c54514ac787c4ad506b8c4f28a0e6b0bf/mako-1.4.3.tar.gz"
sha256 = "cd6537fe88d5fec315c55c2f8529bc4ce7a9a352ad7db3eeaa6a66e2dd4ec37a"
dest = "mako"

[[source]]
url = "https://files.pythonhosted.org/packages/38/9b/e422a865e1d5d57d0e509b4e0bf1c1a70a7f6382c29a5aa428df994c8bc8/markupsafe-3.0.4.tar.gz"
sha256 = "2e9ad7dd851bf45fab9f75cbff4cb493fee9979e8d8c7c9c3ee119022518edd6"
dest = "markupsafe"

[[source]]
url = "https://files.pythonhosted.org/packages/05/8e/961c0007c59b8dd7729d542c61a4d537767a59645b82a0b521206e1e25c2/pyyaml-6.0.3.tar.gz"
sha256 = "d76623373421df22fb4cf8817020cbb7ef15c725b9d5e45f17e189bfc384190f"
dest = "pyyaml"

[[source]]
url = "https://files.pythonhosted.org/packages/7d/fa/3944b40b07da9ce895c0e6303a5ab7d53da063554f534556b134a54d6093/packaging-26.3.tar.gz"
sha256 = "94edc256424af38762eb31306eed28beb9f0efc50a8837492c9d6fd6004aed79"
dest = "packaging"

[[source]]
url = "https://files.pythonhosted.org/packages/df/bf/f7da0350254c0ed7c72f3e33cef02e048281fec7ecec5f032d4aac52226b/jinja2-3.1.6.tar.gz"
sha256 = "0137fb05990d35f1275a587e9aee6d56da821fc83491a0fb838183be43f66d6d"
dest = "jinja2"

[depends]
build = ["toolchain", "python"]
run = ["python"]

[build]
script = """
site=$(python3 -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
mkdir -p "$site"
cp -r mako/mako markupsafe/src/markupsafe pyyaml/lib/yaml \\
    packaging/src/packaging jinja2/src/jinja2 "$site/"
rm -f "$site"/markupsafe/_speedups.c
python3 -m compileall -q "$site"/{mako,markupsafe,yaml,packaging,jinja2}
python3 -c 'import mako, markupsafe, yaml, packaging.version, jinja2'
"""
