[package]
name = "just"
version = "1.58.0"
description = "Command runner, for COSMIC's justfiles"
license = "CC0-1.0"
homepage = "https://just.systems"

[[source]]
url = "https://github.com/casey/just/archive/refs/tags/1.58.0.tar.gz"
sha256 = "c8a36e6e9397f2fdfcb0cc246fcdb790b52a784f3c8cabc0d8baeb031852a148"

[depends]
build = ["toolchain", "stage1-rust"]
run = ["glibc", "gcc"]

[build]
vendor = "cargo"
script = """
cargo build --release --frozen
install -Dm755 target/release/just /usr/bin/just
"""
