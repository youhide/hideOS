# Wayland only. llvmpipe and softpipe draw without a GPU — in QEMU, and
# on any machine whose GPU is not supported yet; virgl is QEMU's
# accelerated GPU; radeonsi is AMD; iris is Intel, Broadwell (Gfx8)
# onwards — Gfx8 through the ELK compiler, which is on by default. No
# Vulkan drivers yet: COSMIC's renderer falls back to GLES.
#
# iris carries OpenCL C kernels (BLORP's blits and clears, indirect
# draw generation, query copies), compiled while Mesa builds: mesa_clc
# — clang's OpenCL front end, from libclang-cpp, and LLVMSPIRVLib —
# turns them into SPIR-V, SPIRV-Tools links that, and vtn_bindgen2
# turns it into C that builds NIR, compiled into the driver. Both
# programs are built here from the same LLVM and run only during this
# build; neither is installed (install-mesa-clc stays off), so the
# image gets no clang, no translator and no OpenCL. mesa-clc and
# spirv-tools are enabled explicitly, so that a missing dependency
# fails the configure instead of quietly dropping iris. libclc is not
# needed: only rusticl and Microsoft's CLC link it, both off.
#
# Behind libglvnd: Mesa installs its EGL as a vendor library,
# libEGL_mesa, and libglvnd's libEGL picks the vendor for each display.
# NVIDIA's EGL, from the nvidia system extension, is only ever such a
# vendor library, and a laptop with an Intel or AMD GPU beside an NVIDIA
# one needs both in one process.
# SPIRV-Tools is static (spirv-tools's recipe), so what Mesa uses of
# it is inside libgallium, and no new library reaches the image.
[package]
name = "mesa"
version = "26.2.4"
description = "OpenGL ES and EGL, with the GPU drivers"
license = "MIT"
homepage = "https://mesa3d.org"

[[source]]
url = "https://archive.mesa3d.org/mesa-26.2.4.tar.xz"
sha256 = "bce5f7fbebb934373b86c999a064d52fb5065878dc57f287f95346648ec832e9"

[depends]
build = ["buildtools", "libglvnd", "llvm", "spirv-tools", "spirv-llvm-translator", "libdrm", "wayland", "wayland-protocols", "expat", "zstd", "elfutils", "eudev"]
run = ["glibc", "gcc", "zlib", "libglvnd", "llvm", "libdrm", "wayland", "expat", "zstd", "elfutils", "eudev"]

[build]
script = """
meson setup build . \\
    --prefix=/usr \\
    --libdir=lib \\
    --sysconfdir=/etc \\
    --localstatedir=/var \\
    --buildtype=release \\
    --wrap-mode=nodownload \\
    -Dplatforms=wayland \\
    -Dglx=disabled \\
    -Dxlib-lease=disabled \\
    -Degl=enabled \\
    -Dgbm=enabled \\
    -Dgles1=disabled \\
    -Dgles2=enabled \\
    -Dopengl=true \\
    -Dglvnd=enabled \\
    -Dgallium-drivers=llvmpipe,softpipe,virgl,radeonsi,iris \\
    -Dvulkan-drivers=[] \\
    -Dllvm=enabled \\
    -Dshared-llvm=enabled \\
    -Ddraw-use-llvm=true \\
    -Damd-use-llvm=true \\
    -Dgallium-va=disabled \\
    -Dvideo-codecs=[] \\
    -Dgallium-rusticl=false \\
    -Dmicrosoft-clc=disabled \\
    -Dmesa-clc=enabled \\
    -Dinstall-mesa-clc=false \\
    -Dspirv-tools=enabled \\
    -Dteflon=false \\
    -Dvalgrind=disabled \\
    -Dlibunwind=disabled \\
    -Dlmsensors=disabled \\
    -Dselinux=false \\
    -Dzstd=enabled \\
    -Dexpat=enabled \\
    -Dxmlconfig=enabled \\
    -Dshader-cache=enabled \\
    -Dbuild-tests=false \\
    -Dhtml-docs=disabled \\
    -Dperfetto=false \\
    -Dsysprof=false \\
    -Dintel-rt=disabled \\
    -Dcpp_rtti=true
meson compile -C build -j "$JOBS"
meson install -C build
# Mesa's EGL is a vendor library, which libglvnd's libEGL loads.
test -f /usr/lib/libEGL_mesa.so.0
test -f /usr/share/glvnd/egl_vendor.d/50_mesa.json
"""
