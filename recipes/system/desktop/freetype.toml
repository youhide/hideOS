[package]
name = "freetype"
version = "2.14.3"
description = "Font rendering library"
license = "FTL OR GPL-2.0-or-later"
homepage = "https://freetype.org"

[[source]]
url = "https://download.savannah.gnu.org/releases/freetype/freetype-2.14.3.tar.xz"
sha256 = "36bc4f1cc413335368ee656c42afca65c5a3987e8768cc28cf11ba775e785a5f"

[depends]
build = ["toolchain", "libpng"]
run = ["glibc", "zlib", "libpng"]

[build]
script = """
./configure \\
    --prefix=/usr \\
    --build="$TARGET" \\
    --sysconfdir=/etc \\
    --localstatedir=/var \\
    --disable-static \\
    --enable-freetype-config \\
    --with-harfbuzz=no \\
    --with-brotli=no \\
    --with-bzip2=no \\
    --with-png=yes \\
    --with-zlib=yes
make -j"$JOBS"
make install
"""
