# What the Workstation adds to boot: seats, authorization and the login
# screen, as oxinit units — device management and the system bus are every
# edition's, in hideos-units; the PAM stacks and the greetd
# configuration they use, and hideOS's defaults for COSMIC. See
# recipes/system/images/workstation.toml.
[package]
name = "desktop-units"
version = "1"
description = "hideOS desktop services for oxinit, PAM and greetd configuration"
license = "MIT"

[depends]
# COSMIC's own defaults for the components hideOS changes a key of.
build = ["toolchain", "cosmic-panel", "cosmic-applets"]
run = [
    "hideos-units",
    "hide",
    "elogind",
    "sudo-rs",
    "polkit",
    "pipewire",
    "wireplumber",
    "linux-pam",
    "greetd",
    "cosmic-greeter",
    "dbus",
]

[build]
script = """
install -Dm644 -t /usr/lib/oxinit/units "$FILES"/units/*.toml
# The session's own services, under `oxinit --user`; start-cosmic runs it.
install -Dm644 -t /usr/lib/oxinit/user-units "$FILES"/user-units/*.toml
install -Dm644 -t /usr/lib/pam.d "$FILES"/pam.d/*
install -Dm644 -t /usr/lib/greetd "$FILES"/greetd/config.toml
install -Dm644 -t /usr/share/hideos/xdg/autostart "$FILES"/autostart/*.desktop
# hideOS's COSMIC defaults, found before COSMIC's own because start-cosmic
# puts /usr/share/hideos first in XDG_DATA_DIRS. The dock lists what is
# installed. The panel is laid out as a Mac's menu bar is: thin, the
# system menu (lock, log out, restart, shut down) and Applications on the
# left, status and the update applet on the right, the weekday, date and
# time in the corner; nothing the dock already has. The theme is Dracula (draculatheme.com, MIT), computed by
# COSMIC's own theme builder: tools/cosmic-dracula writes it.
#
# COSMIC takes a component's defaults from the first data directory that
# has the component at all, not key by key: a panel with only its applet
# list here lost its size, its clock and its button labels to the
# built-in fallbacks. So a component hideOS changes is copied whole from
# its package first, and hideOS's keys laid over it.
mkdir -p /usr/share/hideos/cosmic
for component in com.system76.CosmicPanel.Panel com.system76.CosmicAppList; do
    cp -r "/usr/share/cosmic/$component" /usr/share/hideos/cosmic/
done
cp -r "$FILES/cosmic/." /usr/share/hideos/cosmic/
test -f /usr/share/hideos/cosmic/com.system76.CosmicPanel.Panel/v1/size
grep -q os.hide.UpdateApplet /usr/share/hideos/cosmic/com.system76.CosmicPanel.Panel/v1/plugins_wings
"""
