# The greeter's system-bus half: reads each user's theme and wallpaper so
# the greeter can show them. It has no D-Bus activation file; it is started
# here, before greetd. hideOS's COSMIC defaults first, as the greeter and
# the session have them: a person who never chose a theme has Dracula's.
[unit]
description = "COSMIC greeter daemon"
requires    = ["dbus"]
after       = ["dbus"]

[service]
exec    = "/usr/bin/env XDG_DATA_DIRS=/usr/share/hideos:/usr/local/share:/usr/share /usr/bin/cosmic-greeter-daemon"
restart = "on-failure"
