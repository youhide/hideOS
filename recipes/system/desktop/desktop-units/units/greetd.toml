# The login screen: cosmic-greeter on cosmic-comp, then the session the
# person picks.
[unit]
description = "Login manager"
requires    = ["dbus", "hidelogin"]
wants       = ["cosmic-greeter-daemon", "udev-settle"]
after       = ["hidelogin", "cosmic-greeter-daemon", "udev-settle"]

[service]
exec    = "/usr/bin/greetd --config /usr/lib/greetd/config.toml"
restart = "always"
