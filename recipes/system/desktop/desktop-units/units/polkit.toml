# Answers "may this user do that?" for elogind and COSMIC. Started at boot
# rather than on the first D-Bus call: elogind asks it from the first
# login. polkitd drops to the polkitd user by itself.
[unit]
description = "Authorization manager"
requires    = ["dbus"]
after       = ["dbus", "setup"]

[service]
exec    = "/usr/lib/polkit-1/polkitd --no-debug"
restart = "on-failure"
