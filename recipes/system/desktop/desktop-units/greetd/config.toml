# greetd for hideOS: cosmic-greeter as the greeter, run by its own user,
# and logins through the cosmic-greeter PAM service. Read from /usr/lib,
# given to greetd with --config, so /etc/greetd is never needed.
[terminal]
vt = 1

[general]
service = "cosmic-greeter"

# hideOS's COSMIC defaults first, as in the session (start-cosmic): the
# greeter in Dracula too.
[default_session]
command = "env XDG_DATA_DIRS=/usr/share/hideos:/usr/local/share:/usr/share cosmic-greeter-start"
user = "cosmic-greeter"
