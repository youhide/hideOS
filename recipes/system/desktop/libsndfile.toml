# What pw-play reads sound files with: the theme's are Ogg Vorbis.
# Without MP3 and the sndfile-* programs.
[package]
name = "libsndfile"
version = "1.2.2"
description = "Reading and writing sound files"
license = "LGPL-2.1-or-later"
homepage = "https://libsndfile.github.io/libsndfile/"

[[source]]
url = "https://github.com/libsndfile/libsndfile/releases/download/1.2.2/libsndfile-1.2.2.tar.xz"
sha256 = "3799ca9924d3125038880367bf1468e53a1b7e3686a934f098b7e1d286cdb80e"

[depends]
build = ["toolchain", "libogg", "libvorbis", "opus", "flac"]
run = ["glibc", "libogg", "libvorbis", "opus", "flac"]

[build]
# C17: its ALAC code names an enum's members `false` and `true`, keywords
# in C23, which GCC 16 compiles by default.
script = """
CFLAGS="${CFLAGS:-} -std=gnu17" ./configure \\
    --prefix=/usr \\
    --build="$TARGET" \\
    --disable-static \\
    --disable-mpeg \\
    --disable-sqlite \\
    --disable-alsa \\
    --disable-full-suite
make -j"$JOBS"
make install
"""
