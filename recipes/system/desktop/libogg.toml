[package]
name = "libogg"
version = "1.3.6"
description = "Ogg container library"
license = "BSD-3-Clause"
homepage = "https://xiph.org/ogg/"

[[source]]
url = "https://downloads.xiph.org/releases/ogg/libogg-1.3.6.tar.xz"
sha256 = "5c8253428e181840cd20d41f3ca16557a9cc04bad4a3d04cce84808677fa1061"

[depends]
build = ["toolchain"]
run = ["glibc"]

[build]
script = """
./configure \\
    --prefix=/usr \\
    --build="$TARGET" \\
    --disable-static
make -j"$JOBS"
make install
"""
