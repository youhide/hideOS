# The library only: the flac and metaflac programs are not the system's.
[package]
name = "flac"
version = "1.5.0"
description = "FLAC audio codec"
license = "BSD-3-Clause AND GPL-2.0-or-later"
homepage = "https://xiph.org/flac/"

[[source]]
url = "https://downloads.xiph.org/releases/flac/flac-1.5.0.tar.xz"
sha256 = "f2c1c76592a82ffff8413ba3c4a1299b6c7ab06c734dee03fd88630485c2b920"

[depends]
build = ["toolchain", "libogg"]
run = ["glibc", "libogg"]

[build]
script = """
./configure \\
    --prefix=/usr \\
    --build="$TARGET" \\
    --disable-static \\
    --disable-programs \\
    --disable-examples \\
    --disable-cpplibs \\
    --disable-doxygen-docs \\
    --disable-oggtest
make -j"$JOBS"
make install
"""
