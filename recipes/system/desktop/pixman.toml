[package]
name = "pixman"
version = "0.46.4"
description = "Pixel manipulation library"
license = "MIT"
homepage = "https://pixman.org"

[[source]]
url = "https://www.cairographics.org/releases/pixman-0.46.4.tar.xz"
sha256 = "a098c33924754ad43f981b740f6d576c70f9ed1006e12221b1845431ebce1239"

[depends]
build = ["buildtools"]
run = ["glibc"]

[build]
script = """
meson setup build . \\
    --prefix=/usr \\
    --libdir=lib \\
    --sysconfdir=/etc \\
    --localstatedir=/var \\
    --buildtype=release \\
    --wrap-mode=nodownload \\
    -Dtests=disabled \\
    -Ddemos=disabled \\
    -Dgtk=disabled \\
    -Dlibpng=disabled
meson compile -C build -j "$JOBS"
meson install -C build
"""
