# hideOS Minimal: the system with a terminal and nothing else. The base every
# edition is built on — Workstation depends on this, rather than repeating
# it, so that the two can never ship different versions of the same thing.
# See ARCHITECTURE.md, "Editions".
#
# Everything in its run closure is stage 2; hideforge refuses otherwise.
[package]
name = "minimal"
version = "1"
description = "hideOS Minimal: kernel, oxinit, zsh and the core utilities"
license = "MIT"

[depends]
build = ["toolchain"]
run = [
    "filesystem",
    "glibc",
    "gcc",
    "bash",
    "zsh",
    "coreutils",
    "util-linux",
    "oxinit",
    "hideos-units",
]

[build]
script = "true"

# hideOS ships no compiler: development happens in containers. GCC and
# binutils are in this closure for their runtime libraries — libgcc_s,
# libstdc++ — and everything else they install stays out, until recipes can
# split their outputs.
[image]
exclude = [
    "usr/include/",
    "usr/lib/gcc/",
    "usr/libexec/gcc/",
    "usr/share/man/",
    "usr/share/info/",
    "usr/share/doc/",
    "usr/share/i18n/",
    "*.a",
]
