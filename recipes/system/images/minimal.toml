# hideOS Minimal: kernel, oxinit, zsh and the core utilities, booting to a
# shell on the console.
#
# Everything in its run closure is stage 2; hideforge refuses otherwise.
[package]
name = "minimal"
version = "1"
description = "hideOS Minimal: kernel, oxinit, zsh and the core utilities"
license = "MIT"

[depends]
build = ["toolchain"]
run = ["minimal-base"]

[build]
# The edition's default target: the multi-user system, nothing more.
script = """
install -Dm644 -t /usr/lib/oxinit/units "$FILES/default.toml" "$FILES/boot-ok.toml"
"""

# hideOS ships no compiler: development happens in containers. GCC and
# binutils are in this closure for their runtime libraries — libgcc_s,
# libstdc++ — and everything else they install stays out, until recipes can
# split their outputs.
[image]
exclude = [
    "usr/include/",
    # The kernel's build tree, for modules built outside it; see linux.toml.
    "usr/src/",
    "usr/lib/gcc/",
    "usr/libexec/gcc/",
    "usr/share/man/",
    "usr/share/info/",
    "usr/share/doc/",
    "usr/share/i18n/",
    "*.a",
]
