# hideOS Workstation: Minimal and the desktop. See ARCHITECTURE.md,
# "Editions" and "The desktop".
#
# Boots from its disk only — `cargo xtask install --edition workstation`
# makes one — and reaches the COSMIC greeter.
[package]
name = "workstation"
version = "1"
description = "hideOS Workstation: Minimal and the COSMIC desktop"
license = "MIT"

[depends]
build = ["toolchain"]
run = [
    "minimal-base",
    "desktop-units",
    # First-boot setup, and the languages and time zones it offers.
    "hidesetup",
    "locales",
    "fonts",
    "hicolor-icon-theme",
    # Dead keys and the Compose key: libxkbcommon reads these tables.
    "x11-locale",
    # The volume-change click and the alerts programs look for.
    "sound-theme-freedesktop",
    "polkit",
    "mesa",
    "cosmic-comp",
    "cosmic-session",
    "cosmic-greeter",
    "cosmic-panel",
    "cosmic-applets",
    "cosmic-bg",
    "cosmic-launcher",
    "pop-launcher",
    "cosmic-osd",
    "cosmic-notifications",
    "cosmic-settings-daemon",
    "cosmic-settings",
    "cosmic-files",
    "cosmic-term",
    "cosmic-edit",
    "flatpak",
    "xdg-desktop-portal",
    "xdg-desktop-portal-cosmic",
    # `hide shell`: development tools in containers, not in the system.
    "podman",
    "cosmic-randr",
    "cosmic-workspaces",
    "cosmic-app-library",
    "cosmic-idle",
    "cosmic-osk",
    "cosmic-icons",
    "cosmic-wallpapers",
]

[build]
script = """
install -Dm644 -t /usr/lib/oxinit/units "$FILES/default.toml" "$FILES/boot-ok.toml"
"""

# As Minimal's, and LLVM's and clang's development files: Mesa needs
# libLLVM at run time, nothing in the image needs to compile against it.
[image]
exclude = [
    "usr/include/",
    # The kernel's build tree, for modules built outside it; see linux.toml.
    "usr/src/",
    "usr/lib/gcc/",
    "usr/libexec/gcc/",
    "usr/share/man/",
    "usr/share/info/",
    "usr/share/doc/",
    "usr/share/i18n/",
    "usr/lib/cmake/",
    "usr/lib/clang/",
    "usr/share/clang/",
    "usr/share/opt-viewer/",
    "*.a",
]
