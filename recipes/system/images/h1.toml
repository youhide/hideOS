# The H1 image: the smallest system that boots to a shell under oxinit.
# Everything in its run closure is stage 2; hideforge refuses otherwise.
[package]
name = "image-h1"
version = "1"
description = "H1: kernel, glibc, oxinit and a shell"
license = "MIT"

[depends]
build = ["toolchain"]
run = [
    "filesystem",
    "glibc",
    "gcc",
    "bash",
    "zsh",
    "coreutils",
    "util-linux",
    "oxinit",
    "hideos-units",
]

[build]
script = "true"

# hideOS ships no compiler: development happens in containers. GCC and
# binutils are in this closure for their runtime libraries — libgcc_s,
# libstdc++ — and everything else they install stays out, until recipes can
# split their outputs.
[image]
exclude = [
    "usr/include/",
    "usr/lib/gcc/",
    "usr/libexec/gcc/",
    "usr/share/man/",
    "usr/share/info/",
    "usr/share/doc/",
    "usr/share/i18n/",
    "*.a",
]
