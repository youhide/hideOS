# COSMIC asks logind for its seat, its session and the power buttons.
# cgroup-controller set by hand: left unset, the build reads the build
# machine's /proc/self/cgroup. Shutdown goes to oxinit through hide's
# poweroff, reboot and halt; hide is the desktop units' dependency, not
# this one's, so that a change to hide does not rebuild everything
# that builds against elogind.
[package]
name = "elogind"
version = "257.16"
description = "Seats, sessions and power (logind without systemd)"
license = "LGPL-2.1-or-later"
homepage = "https://github.com/elogind/elogind"

[[source]]
url = "https://github.com/elogind/elogind/archive/refs/tags/v257.16.tar.gz"
sha256 = "3c8146409bfb9daa77f272212c2b0bf0ae727c782ec87ece0d2d25e0e5bf5f4c"

[depends]
build = ["buildtools", "libcap", "util-linux", "linux-pam", "eudev", "dbus"]
run = ["glibc", "libcap", "util-linux", "linux-pam", "eudev", "dbus"]

[build]
script = """
meson setup build . \\
    --prefix=/usr \\
    --libdir=lib \\
    --sysconfdir=/etc \\
    --localstatedir=/var \\
    --buildtype=release \\
    --wrap-mode=nodownload \\
    -Dman=disabled \\
    -Dhtml=disabled \\
    -Dtranslations=false \\
    -Dtests=false \\
    -Dinstall-tests=false \\
    -Dselinux=disabled \\
    -Daudit=disabled \\
    -Dacl=disabled \\
    -Dxenctrl=disabled \\
    -Dsmack=false \\
    -Dpam=enabled \\
    -Dpolkit=disabled \\
    -Dutmp=false \\
    -Dmode=release \\
    -Ddbus=enabled \\
    -Dcgroup-controller=elogind \\
    -Dhalt-path=/usr/bin/halt \\
    -Dpoweroff-path=/usr/bin/poweroff \\
    -Dreboot-path=/usr/bin/reboot \\
    -Dnologin-path=/usr/bin/false \\
    -Dpamlibdir=/usr/lib/security \\
    -Dpamconfdir=/usr/lib/pam.d \\
    -Ddefault-kill-user-processes=false \\
    -Ddbuspolicydir=/usr/share/dbus-1/system.d \\
    -Ddbussystemservicedir=/usr/share/dbus-1/system-services
meson compile -C build -j "$JOBS"
meson install -C build
"""
