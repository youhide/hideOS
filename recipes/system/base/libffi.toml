# Without --with-gcc-arch: the default targets the architecture's
# baseline, and an image runs on more than the machine that built it.
[package]
name = "libffi"
version = "3.8.0"
description = "Foreign function call library"
license = "MIT"
homepage = "https://sourceware.org/libffi/"

[[source]]
url = "https://github.com/libffi/libffi/releases/download/v3.8.0/libffi-3.8.0.tar.gz"
sha256 = "7da3e2d9a171eb0a038f592ecad3ff2bb2550f3496d87b3b29ad0cf4430c0db4"

[depends]
build = ["toolchain"]
run = ["glibc"]

[build]
script = """
./configure \\
    --prefix=/usr \\
    --build="$TARGET" \\
    --sysconfdir=/etc \\
    --localstatedir=/var \\
    --disable-static \\
    --disable-docs
make -j"$JOBS"
make install
"""
