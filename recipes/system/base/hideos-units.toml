# What oxinit starts on every hideOS machine: `hide setup`, a banner, and a
# login shell on the console, grouped as the multi-user target. Which
# target the machine boots to is the edition's; see recipes/system/images.
[package]
name = "hideos-units"
version = "1"
description = "hideOS service units for oxinit"
license = "MIT"

[depends]
build = ["toolchain"]
run = ["oxinit", "zsh", "hide"]

[build]
script = """
install -Dm644 -t /usr/lib/oxinit/units "$FILES"/*.toml
install -Dm644 -t /usr/lib/tmpfiles.d "$FILES"/tmpfiles.d/hideos.conf
"""
