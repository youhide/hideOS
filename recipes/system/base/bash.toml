# The shell scripts run in. Not the login shell; that is zsh.
[package]
name = "bash"
version = "5.3"
description = "Bourne-again shell"
license = "GPL-3.0-or-later"

# GPG signature verified against the GNU keyring (Chet Ramey).
[[source]]
url = "https://ftp.gnu.org/gnu/bash/bash-5.3.tar.gz"
sha256 = "0d5cd86965f869a26cf64f4b71be7b96f90a3ba8b3d74e27e8e9d9d5550f31ba"

[depends]
build = ["toolchain", "ncurses"]
run = ["glibc", "ncurses"]

[build]
script = """
./configure \\
    --prefix=/usr \\
    --build="$TARGET" \\
    --without-bash-malloc \\
    --docdir=/usr/share/doc/bash-5.3
make -j"$JOBS"
make install
ln -sf bash /usr/bin/sh
"""
