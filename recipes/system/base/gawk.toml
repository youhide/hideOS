[package]
name = "gawk"
version = "5.3.2"
description = "AWK"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/gawk/"

[[source]]
url = "https://ftp.gnu.org/gnu/gawk/gawk-5.3.2.tar.xz"
sha256 = "f8c3486509de705192138b00ef2c00bbbdd0e84c30d5c07d23fc73a9dc4cc9cc"

[depends]
build = ["toolchain"]
run = ["glibc"]

[build]
script = """
./configure \\
    --prefix=/usr \\
    --build="$TARGET" \\
    --sysconfdir=/etc \\
    --localstatedir=/var \\
    --disable-static \\
    --without-readline \\
    --without-mpfr
make -j"$JOBS"
make install
# gawk's install links awk to it only when there is no awk, and the
# toolchain's is in the sandbox: so it is linked here, or the system has
# no awk at all.
ln -sf gawk /usr/bin/awk
"""
