# The libudev that libinput, Mesa and Smithay link, and the daemon that
# gives /dev its permissions and names. Until hidedev replaces it; see
# ARCHITECTURE.md, "Component map". With blkid for the by-uuid and
# by-label links, and kmod, through which it loads the module for each
# device it finds: the kernel's drivers are modules (see linux.toml).
[package]
name = "eudev"
version = "3.2.15"
description = "Device manager (udev without systemd)"
license = "GPL-2.0-or-later"
homepage = "https://github.com/eudev-project/eudev"

[[source]]
url = "https://github.com/eudev-project/eudev/releases/download/v3.2.15/eudev-3.2.15.tar.gz"
sha256 = "eb69809fc0d1187f2463ab2149c53aa9f42a78e59f14ebea68eae6cb6b4fc1c3"

[depends]
build = ["buildtools", "util-linux", "kmod"]
run = ["glibc", "util-linux", "kmod"]

[build]
script = """
./configure \\
    --prefix=/usr \\
    --build="$TARGET" \\
    --sysconfdir=/etc \\
    --localstatedir=/var \\
    --disable-static \\
    --bindir=/usr/bin \\
    --sbindir=/usr/bin \\
    --libdir=/usr/lib \\
    --with-rootprefix=/usr \\
    --with-rootlibdir=/usr/lib \\
    --with-rootlibexecdir=/usr/lib/udev \\
    --enable-blkid \\
    --enable-kmod \\
    --disable-manpages \\
    --disable-selinux \\
    --enable-hwdb
make -j"$JOBS"
make install
"""
