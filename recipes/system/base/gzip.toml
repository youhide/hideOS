[package]
name = "gzip"
version = "1.15"
description = "gzip compression"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/gzip/"

[[source]]
url = "https://ftp.gnu.org/gnu/gzip/gzip-1.15.tar.xz"
sha256 = "9aa0cc780dec156b8282844833b342ab7cb08c25d2cd9a1869cdd0df31deff48"

[depends]
build = ["toolchain"]
run = ["glibc"]

[build]
script = """
# gzip.h names a macro `head`, and gzip.c includes <signal.h> after it: on
# aarch64 that brings asm/sigcontext.h, whose every context has a member
# named head. <signal.h> first, and its second inclusion is nothing.
sed -i 's|^#include "gzip.h"$|#include <signal.h>\n#include "gzip.h"|' gzip.c
grep -B1 '^#include "gzip.h"$' gzip.c | head -n 1 | grep -qx '#include <signal.h>'
./configure \\
    --prefix=/usr \\
    --build="$TARGET" \\
    --sysconfdir=/etc \\
    --localstatedir=/var \\
    --disable-static
make -j"$JOBS"
make install
"""
