# Line editing, for nmcli and iwctl. With GNU's upstream patches, which
# readline publishes as files rather than releases.
[package]
name = "readline"
version = "8.3.6"
description = "Line editing and history for interactive programs"
license = "GPL-3.0-or-later"
homepage = "https://tiswww.case.edu/php/chet/readline/rltop.html"

[[source]]
url = "https://ftp.gnu.org/gnu/readline/readline-8.3.tar.gz"
sha256 = "fe5383204467828cd495ee8d1d3c037a7eba1389c22bc6a041f627976f9061cc"

[[source]]
url = "https://ftp.gnu.org/gnu/readline/readline-8.3-patches/readline83-001"
sha256 = "21f0a03106dbe697337cd25c70eb0edbaa2bdb6d595b45f83285cdd35bac84de"
dest = "upstream-patches"
extract = false

[[source]]
url = "https://ftp.gnu.org/gnu/readline/readline-8.3-patches/readline83-002"
sha256 = "e27364396ba9f6debf7cbaaf1a669e2b2854241ae07f7eca74ca8a8ba0c97472"
dest = "upstream-patches"
extract = false

[[source]]
url = "https://ftp.gnu.org/gnu/readline/readline-8.3-patches/readline83-003"
sha256 = "72dee13601ce38f6746eb15239999a7c56f8e1ff5eb1ec8153a1f213e4acdb29"
dest = "upstream-patches"
extract = false

[[source]]
url = "https://ftp.gnu.org/gnu/readline/readline-8.3-patches/readline83-004"
sha256 = "1f189c4566aa35950964647b9ec3be1a821e42b86048129c63eb7f9d4d2f5a74"
dest = "upstream-patches"
extract = false

[[source]]
url = "https://ftp.gnu.org/gnu/readline/readline-8.3-patches/readline83-005"
sha256 = "5481adbe161c9f6ba972c74db9e18c7aa351d3df3035cc4a673a1aa06247d1c6"
dest = "upstream-patches"
extract = false

[[source]]
url = "https://ftp.gnu.org/gnu/readline/readline-8.3-patches/readline83-006"
sha256 = "4ebd261a608287796e171af0ea9af5a1e3122e46672accda2484b6698c47c1a4"
dest = "upstream-patches"
extract = false

[depends]
build = ["toolchain", "ncurses"]
run = ["glibc", "ncurses"]

[build]
script = """
for p in upstream-patches/readline83-*; do patch -p0 < "$p"; done
./configure \\
    --prefix=/usr \\
    --build="$TARGET" \\
    --disable-static \\
    --with-curses
# Linked against ncursesw, so that a program using readline needs to name
# no terminal library itself.
make -j"$JOBS" SHLIB_LIBS="-lncursesw"
make SHLIB_LIBS="-lncursesw" install
"""
