# mkfs.btrfs and btrfs(8): what hide install makes the root filesystem and
# its subvolumes with, and what a system needs to maintain it.
[package]
name = "btrfs-progs"
version = "7.1"
description = "Btrfs filesystem utilities"
license = "GPL-2.0-only"
homepage = "https://btrfs.readthedocs.io"

# Checked against kernel.org's published sha256sums.
[[source]]
url = "https://cdn.kernel.org/pub/linux/kernel/people/kdave/btrfs-progs/btrfs-progs-v7.1.tar.xz"
sha256 = "d1f55cc2971398c9142eaa79d203e63d586a3b4b867f956664a1d68322cd4e34"

[depends]
build = ["toolchain", "util-linux"]
run = ["glibc", "util-linux", "zlib"]

[build]
script = """
# Only what hideOS uses: no zstd or lzo compression yet (zlib is enough to
# read a compressed filesystem), no conversion from ext4, no Python, no
# manual pages.
./configure \\
    --prefix=/usr \\
    --build="$TARGET" \\
    --disable-zstd \\
    --disable-lzo \\
    --disable-libudev \\
    --disable-python \\
    --disable-documentation \\
    --disable-convert \\
    --with-crypto=builtin
make -j"$JOBS"
make install
"""
