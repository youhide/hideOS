# The layout of /var, which is the machine's and starts empty, and the
# compatibility names programs still use for /run. /var/root is root's home,
# as on macOS: /root is in the read-only system image.
d /var/root   0700 - - -
d /var/lib    0755 - - -
d /var/cache  0755 - - -
d /var/log    0755 - - -
d /var/tmp    1777 - - -
d /var/spool  0755 - - -
L /var/run    - - - - ../run
L /var/lock   - - - - ../run/lock
d /run/lock   0755 - - -
# The login shells: pkexec refuses a user whose shell is not in /etc/shells,
# and reads no other file.
L /etc/shells - - - - ../usr/share/factory/etc/shells
