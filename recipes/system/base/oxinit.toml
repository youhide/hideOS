# PID 1. Built from its own repository at a release tag, like any upstream:
# see ARCHITECTURE.md, "Repositories". v0.2.0 brings the hardware watchdog
# and user managers hideOS asked for (M17, M18).
[package]
name = "oxinit"
version = "0.2.0"
description = "Service manager and PID 1"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/youhide/oxinit"

# TLS only: GitHub's archive of the release tag.
[[source]]
url = "https://github.com/youhide/oxinit/archive/refs/tags/v0.2.0.tar.gz"
sha256 = "188e85db00a6930a67d925088776963df8c414bb8dcc4a7008e955e21731c57f"

[depends]
build = ["toolchain", "stage1-rust"]
run = ["glibc", "gcc"]

[build]
vendor = "cargo"
script = """
cargo build --release --locked -p oxinit -p oxctl -p oxlogd
install -Dm755 -t /usr/bin target/release/oxinit target/release/oxctl target/release/oxlogd
mkdir -p /usr/lib/oxinit/units
"""
