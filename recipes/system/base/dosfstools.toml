# mkfs.vfat, for the EFI system partition.
[package]
name = "dosfstools"
version = "4.2"
description = "FAT filesystem utilities"
license = "GPL-3.0-or-later"
homepage = "https://github.com/dosfstools/dosfstools"

# TLS only: the release signature is not checked yet.
[[source]]
url = "https://github.com/dosfstools/dosfstools/releases/download/v4.2/dosfstools-4.2.tar.gz"
sha256 = "64926eebf90092dca21b14259a5301b7b98e7b1943e8a201c7d726084809b527"

[depends]
build = ["toolchain"]
run = ["glibc"]

[build]
script = """
./configure --prefix=/usr --build="$TARGET" --enable-compat-symlinks
make -j"$JOBS"
make install
"""
