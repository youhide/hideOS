# The kernel. On x86_64, Arch Linux's configuration for the same release —
# broad, maintained, and tested on real machines — with hideOS's fragment
# merged over it; elsewhere the architecture's default. Drivers are modules
# in /usr/lib/modules, under the seal, loaded by udev; what the boot needs
# before the root is mounted is built in (see linux/hideos.config).
[package]
name = "linux"
version = "7.2.8"
description = "Linux kernel"
license = "GPL-2.0-only"
homepage = "https://kernel.org"

# Checked against kernel.org's published sha256sums for v7.x.
[[source]]
url = "https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.2.8.tar.xz"
sha256 = "12e8d5a973d1ad7c5a5c69882e4022b131ed715db7003fdcd760ddf8c3e51941"

# Arch's configuration for 7.2.8 (archlinux/packaging/packages/linux, tag
# 7.2.8.arch1-2). Over TLS from Arch's GitLab; Arch signs packages, not
# this file.
[[source]]
url = "https://gitlab.archlinux.org/archlinux/packaging/packages/linux/-/raw/7.2.8.arch1-2/config.x86_64"
sha256 = "ff668413582a831e0ec872852b42570278cf3d5b3b394b4de13cf6b9119ad04e"
extract = false
dest = "hideos-base-config"
arch = "x86_64"

[depends]
# kmod for depmod, zstd to compress the modules.
build = ["toolchain", "elfutils", "openssl", "kmod", "zstd"]

[build]
script = """
# The kernel reads ARCH from the environment, and calls aarch64 arm64.
case "$ARCH" in
    aarch64) export ARCH=arm64; image=arch/arm64/boot/Image ;;
    x86_64) image=arch/x86/boot/bzImage ;;
esac

make mrproper
if [ -f hideos-base-config/config.x86_64 ]; then
    cp hideos-base-config/config.x86_64 .config
    make olddefconfig
else
    make defconfig
fi
scripts/kconfig/merge_config.sh -m .config "$FILES/hideos.config"
make olddefconfig

# Every line of the fragment must have survived: merge_config warns about a
# symbol olddefconfig dropped, and a warning in a build log is a setting
# nobody will notice is missing.
missing=0
while IFS= read -r line; do
    case "$line" in ''|'#'*) continue ;; esac
    grep -qxF "$line" .config || { echo "not applied: $line"; missing=1; }
done < "$FILES/hideos.config"
[ "$missing" = 0 ]

make -j"$JOBS" KBUILD_BUILD_USER=hideforge KBUILD_BUILD_HOST=hideforge \\
    KBUILD_BUILD_TIMESTAMP="@$SOURCE_DATE_EPOCH" "$(basename "$image")" modules
release=$(make -s kernelrelease)
# Installed under /usr — the kernel puts them in $INSTALL_MOD_PATH/lib/modules
# — and indexed after: the kernel's depmod step passes `-b /usr`, and this
# kmod, whose module directory is /usr/lib/modules already, would look in
# /usr/usr/lib/modules.
make INSTALL_MOD_PATH=/usr INSTALL_MOD_STRIP=1 DEPMOD=true modules_install
depmod -a -e -F System.map "$release"
# modules_install links build/ and source/ to this source tree, which is
# not kept. Out-of-tree builds name /usr/src/linux-<release> themselves:
# a build/ link into what images leave out would dangle in every image.
rm -f "/usr/lib/modules/$release/build" "/usr/lib/modules/$release/source"
install -Dm644 "$image" "/usr/lib/modules/$release/vmlinuz"
install -Dm644 .config "/usr/lib/modules/$release/config"

# The build tree, for modules built outside the kernel — NVIDIA's, in its
# system extension — at /usr/src/linux-<release>, which images leave out:
# what the kernel's Makefiles read when a module is built against it, as
# distributions' kernel-headers packages carry it.
tree="/usr/src/linux-$release"
install -Dm644 -t "$tree" .config Makefile Module.symvers System.map
install -Dm644 -t "$tree/kernel" kernel/Makefile
cp -a scripts include "$tree/"
if [ "$ARCH" = x86_64 ]; then
    install -Dm644 -t "$tree/arch/x86" arch/x86/Makefile arch/x86/Makefile_32.cpu
    cp -a arch/x86/include "$tree/arch/x86/"
    install -Dm644 -t "$tree/arch/x86/kernel" arch/x86/kernel/asm-offsets.s
    install -Dm755 -t "$tree/tools/objtool" tools/objtool/objtool
fi
find . -path ./scripts -prune -o \\( -name 'Kbuild*' -o -name 'Kconfig*' \\) -type f -print |
    while read -r f; do install -Dm644 "$f" "$tree/$f"; done
# The build artefacts of the tree's own tools stay; the objects do not.
find "$tree" -name '*.o' -delete -o -name '.*.cmd' -delete
"""
