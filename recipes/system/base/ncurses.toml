[package]
name = "ncurses"
version = "6.6"
description = "Terminal handling library"
license = "MIT"

# GPG signature verified against the GNU keyring (Thomas E. Dickey).
[[source]]
url = "https://ftp.gnu.org/gnu/ncurses/ncurses-6.6.tar.gz"
sha256 = "355b4cbbed880b0381a04c46617b7656e362585d52e9cf84a67e2009b749ff11"

[depends]
build = ["toolchain"]
run = ["glibc", "gcc"]

[build]
script = """
./configure \\
    --prefix=/usr \\
    --build="$TARGET" \\
    --mandir=/usr/share/man \\
    --with-shared \\
    --without-debug \\
    --without-normal \\
    --with-cxx-shared \\
    --enable-pc-files \\
    --with-pkg-config-libdir=/usr/lib/pkgconfig
make -j"$JOBS"
# Into a staging directory first: the shell running this script links the
# stage-0 libncursesw, and overwriting a library in use in place crashes it.
# install(1) replaces the file instead, which leaves the old one mapped.
make DESTDIR="$PWD/dest" install
install -m755 dest/usr/lib/libncursesw.so.6.6 /usr/lib/
rm dest/usr/lib/libncursesw.so.6.6
sed -e 's/^#if.*XOPEN.*$/#if 1/' -i dest/usr/include/curses.h
cp -a dest/. /
for lib in ncurses form panel menu; do
    ln -sf "lib${lib}w.so" "/usr/lib/lib${lib}.so"
    ln -sf "${lib}w.pc" "/usr/lib/pkgconfig/${lib}.pc"
done
ln -sf libncursesw.so /usr/lib/libcurses.so
"""
