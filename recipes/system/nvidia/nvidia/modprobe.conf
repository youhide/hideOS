# The NVIDIA driver's module configuration, from the nvidia system
# extension. The image's kernel command line is fixed by its signed UKI, so
# what NVIDIA documents as kernel parameters is set here: these modules are
# never in the initrd, and are loaded by udev through libkmod, which reads
# /usr/lib/modprobe.d. Overrides go in /etc/modprobe.d.

# nouveau (and nova, once a kernel has it) claim the same PCI IDs, and the
# first driver to bind keeps the GPU. A blacklist stops loading by alias,
# which is how udev loads drivers; `modprobe nouveau` by name still works.
blacklist nouveau
blacklist nova_core
blacklist nova_drm

# udev loads nvidia for the GPU's PCI alias. Nothing would load nvidia-drm,
# which has no alias of its own, and without it there is no KMS and no
# /dev/dri card for the compositor; nvidia-modeset comes with it, as its
# dependency. nvidia-uvm is CUDA's.
softdep nvidia post: nvidia-uvm nvidia-drm

# Kernel modesetting, and the console on nvidia-drm's fbdev, which takes
# over from the firmware's framebuffer (simpledrm). Both are 615's
# defaults; written down so that a new default is not a silent change.
options nvidia_drm modeset=1 fbdev=1

# Video memory is saved across suspend and hibernation in an unnamed file
# in this directory. Not /tmp, NVIDIA's default: on hideOS that is a tmpfs,
# in the very memory being saved, and gone after hibernation.
options nvidia NVreg_TemporaryFilePath=/var/tmp
