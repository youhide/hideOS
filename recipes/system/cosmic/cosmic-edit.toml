[package]
name = "cosmic-edit"
version = "1.9.0"
description = "COSMIC Text Editor"
license = "GPL-3.0-only"
homepage = "https://github.com/pop-os/cosmic-edit"

[[source]]
url = "https://github.com/pop-os/cosmic-edit/archive/refs/tags/epoch-1.9.0.tar.gz"
sha256 = "2748de5388e637c8390801961961b063e1c15778c33912cdc62448994194a789"

[depends]
build = ["toolchain", "stage1-rust", "just", "glib", "libxkbcommon", "wayland"]
run = ["glibc", "gcc", "wayland", "mesa", "libxkbcommon", "glib"]

[build]
vendor = "cargo"
script = """
export VERGEN_GIT_SHA="epoch-1.9.0"
export VERGEN_GIT_COMMIT_DATE="$(date -u -d "@$SOURCE_DATE_EPOCH" +%Y-%m-%d)"
cargo build --release --frozen
just rootdir=/ prefix=/usr install
"""
