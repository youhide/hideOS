[package]
name = "cosmic-workspaces"
version = "1.9.0"
description = "COSMIC workspaces overview"
license = "GPL-3.0-only"
homepage = "https://github.com/pop-os/cosmic-workspaces-epoch"

[[source]]
url = "https://github.com/pop-os/cosmic-workspaces-epoch/archive/refs/tags/epoch-1.9.0.tar.gz"
sha256 = "cf9afff9ba023abe3bd996b82ceda7a295f63bcdbbd9ad784a9643a86c647f04"

[depends]
build = ["toolchain", "stage1-rust", "just", "mesa", "libinput", "eudev", "libxkbcommon", "wayland"]
run = ["glibc", "gcc", "wayland", "mesa", "libxkbcommon", "libinput", "eudev"]

[build]
vendor = "cargo"
script = """
export VERGEN_GIT_SHA="epoch-1.9.0"
export VERGEN_GIT_COMMIT_DATE="$(date -u -d "@$SOURCE_DATE_EPOCH" +%Y-%m-%d)"
cargo build --release --frozen
make install DESTDIR= prefix=/usr CARGO_TARGET_DIR=target
"""
