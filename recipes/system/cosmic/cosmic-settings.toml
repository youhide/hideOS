[package]
name = "cosmic-settings"
version = "1.9.0"
description = "COSMIC Settings"
license = "GPL-3.0-only"
homepage = "https://github.com/pop-os/cosmic-settings"

[[source]]
url = "https://github.com/pop-os/cosmic-settings/archive/refs/tags/epoch-1.9.0.tar.gz"
sha256 = "1e33fec9dc70408a85eca4055dca16afa82baadc2edb957e1400294b09f2ff27"

[depends]
build = ["toolchain", "stage1-rust", "just", "libinput", "eudev", "dav1d", "libxkbcommon", "wayland"]
run = ["glibc", "gcc", "wayland", "mesa", "libxkbcommon", "libinput", "eudev", "dav1d", "xkeyboard-config"]

[build]
vendor = "cargo"
# System → Updates: hideOS's page, talking to hideupd.
patches = ["hideos-updates.patch"]
script = """
export VERGEN_GIT_SHA="epoch-1.9.0"
export VERGEN_GIT_COMMIT_DATE="$(date -u -d "@$SOURCE_DATE_EPOCH" +%Y-%m-%d)"
cargo build --release --frozen
just rootdir=/ prefix=/usr install
"""
