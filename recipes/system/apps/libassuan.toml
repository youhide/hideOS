# The IPC protocol GnuPG's programs talk among themselves, and gpgme to
# them.
[package]
name = "libassuan"
version = "3.0.2"
description = "IPC library used by GnuPG and gpgme"
license = "LGPL-2.1-or-later"
homepage = "https://gnupg.org/software/libassuan/"

# Checked against the .sig, made with GnuPG's dist signing key (2020).
[[source]]
url = "https://gnupg.org/ftp/gcrypt/libassuan/libassuan-3.0.2.tar.bz2"
sha256 = "d2931cdad266e633510f9970e1a2f346055e351bb19f9b78912475b8074c36f6"

[depends]
build = ["toolchain", "libgpg-error"]
run = ["glibc", "libgpg-error"]

[build]
script = """
./configure \\
    --prefix=/usr \\
    --build="$TARGET" \\
    --disable-static \\
    --disable-doc
make -j"$JOBS"
make install
"""
