# XML, which flatpak and AppStream parse Flathub's application metadata
# with. Without the Python bindings, ICU and the interactive shell's
# readline.
[package]
name = "libxml2"
version = "2.15.4"
description = "XML parser and toolkit"
license = "MIT"
homepage = "https://gitlab.gnome.org/GNOME/libxml2"

# Checked against the .sha256sum published with the release.
[[source]]
url = "https://download.gnome.org/sources/libxml2/2.15/libxml2-2.15.4.tar.xz"
sha256 = "98087fd181d9070724f3fbc65c7377db03038eb92bd882374daff44940138821"

[depends]
build = ["buildtools"]
run = ["glibc", "zlib"]

[build]
script = """
meson setup build . \\
    --prefix=/usr \\
    --libdir=lib \\
    --sysconfdir=/etc \\
    --localstatedir=/var \\
    --buildtype=release \\
    --wrap-mode=nodownload \\
    -Dpython=disabled \\
    -Ddocs=disabled \\
    -Dicu=disabled \\
    -Dreadline=disabled \\
    -Dhistory=disabled \\
    -Dhttp=disabled \\
    -Dzlib=enabled
meson compile -C build -j "$JOBS"
meson install -C build
"""
