# Image loading, for one purpose: flatpak and xdg-desktop-portal check
# that an application's icon is an image before they export or show it,
# in a bubblewrap sandbox. PNG only, built in; no glycin, whose loaders
# are separate Rust programs, and no JPEG or TIFF. Formats are recognised
# by gdk-pixbuf's own signatures rather than through GIO, which would
# need shared-mime-info's database.
[package]
name = "gdk-pixbuf"
version = "2.44.8"
description = "Image loading library for GLib programs"
license = "LGPL-2.1-or-later"
homepage = "https://gitlab.gnome.org/GNOME/gdk-pixbuf"

# Checked against the .sha256sum published with the release.
[[source]]
url = "https://download.gnome.org/sources/gdk-pixbuf/2.44/gdk-pixbuf-2.44.8.tar.xz"
sha256 = "919f529512961a12e81cd4b4b466a48c3933469e7f9a310c6513cd4fb252ba3c"

[depends]
build = ["buildtools", "glib", "libpng"]
run = ["glibc", "glib", "libpng"]

[build]
script = """
# glib-mkenums is Python, from glib: see networkmanager.toml.
export PYTHONDONTWRITEBYTECODE=1
meson setup build . \\
    --prefix=/usr \\
    --libdir=lib \\
    --sysconfdir=/etc \\
    --localstatedir=/var \\
    --buildtype=release \\
    --wrap-mode=nodownload \\
    -Dpng=enabled \\
    -Djpeg=disabled \\
    -Dtiff=disabled \\
    -Dgif=disabled \\
    -Dothers=disabled \\
    -Dglycin=disabled \\
    -Dbuiltin_loaders=png \\
    -Dgio_sniffing=false \\
    -Dthumbnailer=disabled \\
    -Dintrospection=disabled \\
    -Ddocumentation=false \\
    -Dgtk_doc=false \\
    -Dman=false \\
    -Dtests=false \\
    -Dinstalled_tests=false
meson compile -C build -j "$JOBS"
meson install -C build
"""
