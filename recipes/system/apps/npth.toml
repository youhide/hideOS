# The threads GnuPG runs on. Only gnupg links it.
[package]
name = "npth"
version = "1.8"
description = "The new GNU portable threads library"
license = "LGPL-2.1-or-later"
homepage = "https://gnupg.org/software/npth/"

# Checked against the .sig, made with GnuPG's dist signing key (2020).
[[source]]
url = "https://gnupg.org/ftp/gcrypt/npth/npth-1.8.tar.bz2"
sha256 = "8bd24b4f23a3065d6e5b26e98aba9ce783ea4fd781069c1b35d149694e90ca3e"

[depends]
build = ["toolchain"]
run = ["glibc"]

[build]
script = """
./configure \\
    --prefix=/usr \\
    --build="$TARGET" \\
    --disable-static \\
    --disable-tests
make -j"$JOBS"
make install
"""
