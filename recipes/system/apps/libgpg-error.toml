# The error codes and runtime that GnuPG and its libraries share. The
# bottom of the stack gpgme stands on: flatpak and ostree check Flathub's
# signatures through gpgme.
[package]
name = "libgpg-error"
version = "1.61"
description = "Error codes and runtime for GnuPG and its libraries"
license = "LGPL-2.1-or-later"
homepage = "https://gnupg.org/software/libgpg-error/"

# Checked against the .sig, made with GnuPG's dist signing key (2020).
[[source]]
url = "https://gnupg.org/ftp/gcrypt/libgpg-error/libgpg-error-1.61.tar.bz2"
sha256 = "7a85413f2bc354f4f8aa832b718af122e48965e9e0eb9012ee659c13c6385c93"

[depends]
build = ["toolchain"]
run = ["glibc"]

[build]
script = """
./configure \\
    --prefix=/usr \\
    --build="$TARGET" \\
    --disable-static \\
    --disable-nls \\
    --disable-doc \\
    --disable-tests \\
    --disable-languages
make -j"$JOBS"
make install
"""
