# Containers: what `hide shell` runs, and what anyone can use directly.
# Rootless — a user's containers are theirs, in their home — with oxinit
# and elogind rather than systemd, on cgroup v2. See ARCHITECTURE.md,
# "Applications and development".
#
# The Go modules Podman builds from are in the release archive's vendor/,
# so nothing is downloaded: -mod=vendor, GOPROXY=off.
#
# Build tags, Podman's Makefile's defaults with every one it would
# autodetect decided here:
#   seccomp                     libseccomp, for the default syscall filter
#   exclude_graphdriver_btrfs   overlay is the rootless driver; the btrfs
#   exclude_graphdriver_zfs     driver needs privileges, ZFS is not here
#   containers_image_openpgp    image signatures checked in Go, not by
#                               running gpg through gpgme
#   grpcnotrace                 upstream's default
# and not: systemd (no journald, no systemd cgroup manager), apparmor,
# selinux, libsubid (Podman reads /etc/subuid itself), libsqlite3 (the
# vendored go-sqlite3 compiles its own SQLite, Podman's database; hideOS
# ships no SQLite library).
#
# Installed: podman, and rootlessport, which Podman runs to forward ports
# for rootless containers. Not quadlet and its systemd generators, the
# systemd units, podman-remote, or the man pages, which need go-md2man.
[package]
name = "podman"
version = "6.1.3"
description = "Daemonless, rootless container engine"
license = "Apache-2.0"
homepage = "https://podman.io"

# Releases are git tags; no signed source archive or digest is published:
# TLS from GitHub.
[[source]]
url = "https://github.com/containers/podman/archive/refs/tags/v6.1.3.tar.gz"
sha256 = "6253aee14e573f747ca77e5a83a0df4ef9c2f609604f56715070ed06b6f9ddd8"

[depends]
build = ["toolchain", "go", "libseccomp"]
run = [
    "glibc",
    "libseccomp",
    "containers-common",
    "conmon",
    "crun",
    "netavark",
    "aardvark-dns",
    "passt",
    "catatonit",
    "shadow",
]

[build]
script = """
export GOPROXY=off GOTOOLCHAIN=local CGO_ENABLED=1
export GOFLAGS="-mod=vendor -trimpath"
tags="seccomp exclude_graphdriver_btrfs exclude_graphdriver_zfs containers_image_openpgp grpcnotrace"
make -j"$JOBS" bin/podman bin/rootlessport \\
    PREFIX=/usr \\
    ETCDIR=/etc \\
    BUILDTAGS="$tags" \\
    GIT_COMMIT=
install -Dm755 bin/podman /usr/bin/podman
install -Dm755 bin/rootlessport /usr/libexec/podman/rootlessport
install -Dm644 completions/zsh/_podman /usr/share/zsh/site-functions/_podman
install -Dm644 completions/bash/podman /usr/share/bash-completion/completions/podman
"""
