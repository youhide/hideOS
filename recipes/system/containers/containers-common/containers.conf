# hideOS's containers.conf(5), in /usr/share/containers. Read as
# registries.conf is: the first main file found, then containers.conf.d
# drop-ins.
#
# Every value here is also what Podman, built without systemd, chooses on
# its own. They are written down so that a reader of this file and
# `podman info` agree, and so that a Podman whose defaults change does not
# change hideOS with it.

[containers]
# No journald: a container's output goes to a file Podman keeps with it.
log_driver = "k8s-file"

[engine]
# oxinit is not systemd, so Podman makes cgroups itself, in cgroup v2's
# unified tree — for root. A rootless container gets no cgroup of its own:
# it stays in the cgroup of whatever started it, and resource limits
# (--memory, --cpus, --pids-limit) are not available to it.
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"

[network]
network_backend = "netavark"
default_rootless_network_cmd = "pasta"
