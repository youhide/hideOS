# hideOS's registries.conf(5), in /usr/share/containers. Podman reads the
# first of ~/.config/containers/registries.conf,
# /etc/containers/registries.conf and this file, then every
# registries.conf.d drop-in; a change belongs in a drop-in, which adds to
# this file rather than replacing it.

# Where a short name such as `fedora` or `ubuntu:24.04` is looked for, in
# order. With short-name-mode at its default, "enforcing", a name found
# in more than one of them is asked about on a terminal and refused
# without one, so that an image never silently comes from a registry
# other than the one meant. Fully qualified names skip all of this.
unqualified-search-registries = ["docker.io", "quay.io", "ghcr.io"]
