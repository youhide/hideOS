# hideOS's storage.conf(5), in /usr/share/containers. Read as
# registries.conf is: the first main file found, then storage.conf.d
# drop-ins.

[storage]
# Overlay, the kernel's, unprivileged: a rootless store is overlay mounted
# inside the user's namespace, with no FUSE helper. It is on btrfs, in
# @home, which overlay supports as upper and lower layers. Podman is built
# without the btrfs driver, which needs privileges a rootless store does
# not have.
driver = "overlay"

# Nothing else: graphroot and runroot set here would apply to rootless
# stores too, and the defaults are right for both — /var/lib/containers
# and /run/containers for root, ~/.local/share/containers and
# $XDG_RUNTIME_DIR/containers for everyone else.
