[workspace]
resolver = "2"
members = [
    "crates/hide",
    "crates/hidecrypt",
    "crates/hideforge",
    "crates/hideforge-recipe",
    "crates/hidestage",
    "crates/xtask",
]
# Its own workspace and lockfile: see its Cargo.toml.
exclude = ["crates/hidesetup"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Stable minus two releases. CI builds on exactly this version, so it is a
# checked promise rather than a guess.
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/youhide/hideOS"
publish = false

[workspace.dependencies]
hideforge-recipe = { path = "crates/hideforge-recipe" }
hidecrypt = { path = "crates/hidecrypt" }

anyhow = "1"
# basic-toml over toml, as in oxinit: serde and nothing else. Recipes need no
# datetimes, spans or format-preserving edits.
basic-toml = "0.1"
rustix = "1.1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Never "abort", in any profile. hidestage and hideboot are on the boot path,
# and an abort there is a machine that does not boot; unwinding leaves a
# `catch_unwind` at the top a chance to reach the fallback shell.
panic = "unwind"

[profile.dev]
panic = "unwind"
