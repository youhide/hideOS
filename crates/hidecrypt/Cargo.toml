[package]
name = "hidecrypt"
version.workspace = true
description = "LUKS2 unlocking and TPM2 sealing for hideOS's encrypted root, with no Linux-only code"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# On the boot path: hidestage unlocks the root with this. Each dependency is
# a primitive LUKS2 names, from RustCrypto, or the JSON parser for its
# metadata; none links C, none has unsafe code of its own beyond what the
# crates audit. The bulk encryption is the kernel's: dm-crypt.
[dependencies]
thiserror.workspace = true
serde = { workspace = true }
serde_json = "1"
base64 = "0.23"
sha2.workspace = true
hmac = "0.13"
pbkdf2 = "0.13"
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
aes = "0.9"
xts-mode = "0.6"
zeroize = "1"
num-bigint = "0.4"
