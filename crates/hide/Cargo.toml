[package]
name = "hide"
version.workspace = true
description = "hideOS's command line: install, and later update, rollback and status"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
# The payload is a tar archive read straight off a disk; hideOS ships no tar
# program, and this needs none.
tar = "0.4"
sha-crypt = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["fs", "mount", "process", "system", "termios"] }
composefs-ioctls = "0.9.3"
hidecrypt.workspace = true
zeroize = "1"
# The store's garbage collection: composefs knows which objects an image
# uses, and hide does not reimplement that.
composefs = "0.9.3"
# `hide update` pulls OCI images, as hideforge writes them, and regenerates
# their boot image; see crates/hideforge/src/payload.rs.
composefs-oci = { version = "0.9.3", default-features = false, features = ["boot"] }
composefs-boot = "0.9.3"
tokio = { version = "1", features = ["rt", "process", "io-util", "macros", "sync"] }
# os.hide.Update1, the D-Bus face of updates: see daemon.rs.
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false }
# Registries: hide's own client, over rustls with ring, which builds with
# the C compiler alone; the system's CA certificates (ca-certificates).
oci-client = { version = "0.18", default-features = false, features = ["rustls-tls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
sha2 = "0.10"
# composefs links OpenSSL. Vendored, as in hideforge: openssl-sys does not
# know hideOS's OpenSSL 4, and the builder image has no libssl-dev. A sealed
# image ships hide and every library together, so a static copy is patched
# by the same update that would patch a shared one.
openssl = { version = "0.10", features = ["vendored"] }
