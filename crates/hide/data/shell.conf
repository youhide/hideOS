# The image `hide shell` makes its containers from: a toolbox image, which
# has sudo, a shell and the usual tools. Fully qualified, so podman never
# has to ask which registry is meant. Change it in /etc/hide/shell.conf —
# quay.io/toolbx/arch-toolbox:latest, quay.io/toolbx/ubuntu-toolbox:24.04.
image = registry.fedoraproject.org/fedora-toolbox:44
