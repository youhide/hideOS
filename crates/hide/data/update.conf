# Where `hide update`, with no image, finds the next system: this machine's
# edition on this channel, as a tag in this registry — for example
# ghcr.io/youhide/hideos:workstation-edge. Either key can be changed in
# /etc/hide/update.conf, which is read after this file.
#
# Channels: stable, beta, edge. Edge while hideOS is pre-alpha, so a
# machine gets every build that passed the tests; stable and beta take
# edge's images later (`cargo xtask promote`).
registry = ghcr.io/youhide/hideos
channel = edge
