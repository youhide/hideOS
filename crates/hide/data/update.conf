# Where `hide update`, with no image, finds the next system: this machine's
# edition on this channel, as a tag in this registry — for example
# ghcr.io/youhide/hideos:workstation-stable. Either key can be changed in
# /etc/hide/update.conf, which is read after this file.
#
# Channels: stable, beta, edge.
registry = ghcr.io/youhide/hideos
channel = stable
