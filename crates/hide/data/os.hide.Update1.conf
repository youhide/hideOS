<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- hideupd, `hide daemon`: only root may own the name; anyone may call it,
     and hideupd decides, asking polkit, who may change the system. -->
<busconfig>
  <policy user="root">
    <allow own="os.hide.Update1"/>
  </policy>
  <policy context="default">
    <allow send_destination="os.hide.Update1"/>
  </policy>
</busconfig>
