[package]
name = "xtask"
version.workspace = true
description = "Development automation: environment checks, the builder container, QEMU"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# xtask runs on the developer's machine, never on the boot path. None of the
# boot-path rules apply. It has one dependency, for the wiki: Markdown is a
# grammar with many corners, and the pages deserve a parser that handles all
# of them. Without default features it brings four small crates, fetched once
# on a fresh checkout; nothing else.
[dependencies]
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
